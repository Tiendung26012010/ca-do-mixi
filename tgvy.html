<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - MyApp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .card {
    background: #fff; width: 100%; max-width: 380px;
    border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .logo {
    width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 16px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 26px; font-weight: 800;
  }
  h1 { text-align: center; font-size: 22px; color: #1f2937; margin-bottom: 4px; }
  p.sub { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 24px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1.5px solid #e5e7eb; border-radius: 10px; outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: #6366f1; }
  .field .error { color: #dc2626; font-size: 12px; margin-top: 4px; display: none; }
  .field.invalid input { border-color: #dc2626; }
  .field.invalid .error { display: block; }

  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; }
  .row label { display: flex; align-items: center; gap: 6px; color: #4b5563; }
  .row a { color: #6366f1; text-decoration: none; }

  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: #6366f1; color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: #4f46e5; }
  .btn:disabled { background: #a5a6f3; cursor: not-allowed; }

  .msg {
    margin-top: 14px; text-align: center; font-size: 14px; min-height: 20px; font-weight: 600;
  }
  .msg.ok { color: #16a34a; }
  .msg.err { color: #dc2626; }

  .footer { text-align: center; margin-top: 18px; font-size: 13px; color: #6b7280; }
  .footer a { color: #6366f1; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">M</div>
  <h1>Chào mừng trở lại</h1>
  <p class="sub">Đăng nhập vào tài khoản MyApp của bạn</p>

  <form id="loginForm" novalidate>
    <div class="field" id="emailField">
      <label for="email">Email hoặc tên đăng nhập</label>
      <input type="text" id="email" placeholder="ban@example.com" autocomplete="username">
      <div class="error">Vui lòng nhập email hợp lệ.</div>
    </div>

    <div class="field" id="passField">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
      <div class="error">Mật khẩu phải có ít nhất 6 ký tự.</div>
    </div>

    <div class="row">
      <label><input type="checkbox" id="remember"> Ghi nhớ đăng nhập</label>
      <a href="#">Quên mật khẩu?</a>
    </div>

    <button type="submit" class="btn" id="submitBtn">Đăng nhập</button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="footer">Chưa có tài khoản? <a href="#">Đăng ký ngay</a></p>
</div>

<script>
const form = document.getElementById('loginForm');
const emailInput = document.getElementById('email');
const passInput = document.getElementById('password');
const emailField = document.getElementById('emailField');
const passField = document.getElementById('passField');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || v.trim().length >= 3; // cho phép username hoặc email
}

form.addEventListener('submit', e => {
  e.preventDefault();
  let valid = true;

  if (!isValidEmail(emailInput.value)) {
    emailField.classList.add('invalid'); valid = false;
  } else {
    emailField.classList.remove('invalid');
  }

  if (passInput.value.length < 6) {
    passField.classList.add('invalid'); valid = false;
  } else {
    passField.classList.remove('invalid');
  }

  if (!valid) {
    msg.textContent = 'Vui lòng kiểm tra lại thông tin.';
    msg.className = 'msg err';
    return;
  }

  // Đây là nơi bạn gọi API đăng nhập thật, ví dụ:
  // fetch('/api/login', { method: 'POST', body: JSON.stringify({ email, password }) })
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập...';
  msg.textContent = '';

  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
    msg.textContent = '✔ Đăng nhập thành công (demo, chưa nối API thật)';
    msg.className = 'msg ok';
  }, 1000);
});
</script>
</body>
</html>
